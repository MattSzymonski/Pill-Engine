[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib"]

[dependencies]
noise = "0.9.0"
pill_engine = { path = "../../engine/pill_engine", features = ["game"] }
rand = "0.9.2"
rayon = "1.11.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
target-cpu = "native"

