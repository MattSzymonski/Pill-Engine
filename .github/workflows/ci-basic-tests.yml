# Pill CI Pipeline - fast checks on every push
#
# Triggers on every push. Builds the launcher once, then fans out to parallel
# jobs covering all 5 checks from run_basic_tests.sh: code formatting, linting,
# native build + artifact size, WASM build + artifact size + budget,
# performance benchmark.

name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build the launcher once, upload as artifact for all downstream jobs
  # ------------------------------------------------------------------
  build_launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
      - name: Build PillLauncher (release)
        run: cargo build --release --manifest-path engine/pill_launcher/Cargo.toml
      - name: Upload PillLauncher artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release/PillLauncher

  # ------------------------------------------------------------------
  # 1. code_formatting_check
  # ------------------------------------------------------------------
  code_formatting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, components: rustfmt }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: rustfmt check
        run: bash devops/tests/run_basic_tests.sh code_formatting_check

  # ------------------------------------------------------------------
  # 2. code_linting_check
  # ------------------------------------------------------------------
  code_linting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "engine -> target" }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: clippy lint
        run: bash devops/tests/run_basic_tests.sh code_linting_check

  # ------------------------------------------------------------------
  # 3. build_native_cube_example - native build + artifact size report
  # ------------------------------------------------------------------
  build_cube:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            examples/cube -> target
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: Build cube example
        run: bash devops/tests/run_basic_tests.sh build_native_cube_example

  # ------------------------------------------------------------------
  # 4. build_wasm_cube_example - WASM build + artifact size report + budget
  # ------------------------------------------------------------------
  build_wasm:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/cube/build/wasm/.build/pill_web -> target
      - uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: WASM build
        run: bash devops/tests/run_basic_tests.sh build_wasm_cube_example

  # ------------------------------------------------------------------
  # 5. benchmark_native_performance (headless - no GPU needed)
  # ------------------------------------------------------------------
  benchmark_performance:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            examples/city -> target
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: City performance benchmark (headless, 3 runs)
        run: bash devops/tests/run_basic_tests.sh benchmark_native_performance
