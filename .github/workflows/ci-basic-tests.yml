# Pill CI Pipeline — fast checks on every push
#
# Triggers on every push. Builds the launcher once, then fans out to parallel
# fast jobs: code check, formatting, linting, a representative native build
# (cube), WASM builds, and the net_minimal crates.
#
# Heavy / slow builds (city, italian_brainrot, floating_pills) and benchmarks
# run on a daily schedule via ci-slow.yml.

name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build the launcher once, upload as artifact for all downstream jobs
  # ------------------------------------------------------------------
  build_launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
      - name: Build PillLauncher (release)
        run: cargo build --release --manifest-path engine/pill_launcher/Cargo.toml
      - name: Upload PillLauncher artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release/PillLauncher

  # ------------------------------------------------------------------
  # Fast parallel jobs — every push
  # ------------------------------------------------------------------

  code_formatting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, components: rustfmt }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: rustfmt check
        run: bash devops/tests/run_basic_tests.sh code_formatting_check

  code_linting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "engine -> target" }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: clippy lint
        run: bash devops/tests/run_basic_tests.sh code_linting_check

  # -- Fast native builds (cube is the smallest/simplest example) -----------
  build_cube:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            examples/cube -> target
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: Build cube example
        run: bash devops/tests/run_basic_tests.sh build_native_cube_example

  # -- net_minimal standalone crates (no PillLauncher needed) ---------------
  build_net_minimal:
    runs-on: ubuntu-latest
    needs: build_launcher
    strategy:
      fail-fast: false
      matrix:
        crate: [examples/net_minimal/client, examples/net_minimal/server]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/net_minimal/client -> target
            examples/net_minimal/server -> target
      - name: Build ${{ matrix.crate }}
        run: cargo build --manifest-path ${{ matrix.crate }}/Cargo.toml

  # -- WASM builds + smoke tests (wasm-pack compiles quickly) ---------------
  build_wasm:
    runs-on: ubuntu-latest
    needs: build_launcher
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/cube
          - examples/pill_tunel
          - examples/pbr_helmet
          - examples/pbr_balls
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/cube/build/wasm/.build/pill_web -> target
            examples/pill_tunel/build/wasm/.build/pill_web -> target
            examples/pbr_helmet/build/wasm/.build/pill_web -> target
            examples/pbr_balls/build/wasm/.build/pill_web -> target
      - uses: jetli/wasm-pack-action@v0.4.0
        with: { version: latest }
      - uses: actions/download-artifact@v4
        with:
          {
            name: pilllauncher-linux,
            path: engine/pill_launcher/target/release,
          }
      - name: WASM build + smoke test
        run: bash devops/tests/run_basic_tests.sh build_wasm_example "${{ matrix.example }}"
