# Pill CI Pipeline
#
# Triggers on every push. Builds the launcher once, then fans out to parallel
# jobs that download the artifact: formatting, clippy, native builds, and WASM.
#
# All build/test logic is now built into PillLauncher itself:
#   pill_launcher -a check|build|wasm-test|benchmark|ci
#
# Job dependency graph:
#   build_launcher ──┬── code_check
#                    ├── code_formatting_check
#                    ├── code_linting_check
#                    ├── build_examples (matrix)
#                    ├── build_wasm_example (matrix)
#                    └── benchmark (main / PR only)
name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
      - name: Build PillLauncher (release)
        run: cargo build --release --manifest-path engine/pill_launcher/Cargo.toml
      - name: Upload PillLauncher artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release/PillLauncher

  code_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: cargo check (engine crates)
        shell: bash
        run: |
          set -euo pipefail
          ./engine/pill_launcher/target/release/PillLauncher -a check

  code_formatting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: rustfmt check
        shell: bash
        run: |
          set -euo pipefail
          ./engine/pill_launcher/target/release/PillLauncher -a cargo -p examples/floating_pills -- fmt
          git diff --exit-code -- . ':(exclude)engine/Cargo.toml' ':(exclude)examples/floating_pills/Cargo.toml'

  code_linting_check:
    runs-on: ubuntu-latest
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: clippy lint (-D warnings)
        shell: bash
        run: |
          set -euo pipefail
          ./engine/pill_launcher/target/release/PillLauncher -a cargo -p examples/floating_pills -- clippy -- -D warnings
          git diff --exit-code -- . ':(exclude)engine/Cargo.toml' ':(exclude)examples/floating_pills/Cargo.toml'

  build_examples:
    runs-on: ubuntu-latest
    needs: build_launcher
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/cube
          - examples/floating_pills
          - examples/italian_brainrot
          - examples/city
          - examples/net_minimal/client
          - examples/net_minimal/server
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            examples/cube -> target
            examples/floating_pills -> target
            examples/italian_brainrot -> target
            examples/city -> target
            examples/net_minimal/client -> target
            examples/net_minimal/server -> target
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: Build example
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          if [[ "$EXAMPLE" == "examples/net_minimal/server" ]]; then
            cargo build --manifest-path "$EXAMPLE/Cargo.toml"
          else
            ./engine/pill_launcher/target/release/PillLauncher -a build -p "$EXAMPLE"
          fi

  build_wasm_example:
    runs-on: ubuntu-latest
    needs: build_launcher
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/cube
          - examples/pill_tunel
          - examples/pbr_helmet
          - examples/pbr_balls
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/cube/build/wasm/.build/pill_web -> target
            examples/pill_tunel/build/wasm/.build/pill_web -> target
            examples/pbr_helmet/build/wasm/.build/pill_web -> target
            examples/pbr_balls/build/wasm/.build/pill_web -> target
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: WASM build + smoke test + size guard
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          BUDGET_FLAG=""
          if [[ "$EXAMPLE" == "examples/cube" ]]; then
            BUDGET_FLAG="--wasm-budget-kb 499"
          fi
          ./engine/pill_launcher/target/release/PillLauncher -a wasm-test -p "$EXAMPLE" $BUDGET_FLAG

  benchmark:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: build_launcher
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - name: Install xvfb (virtual display for windowed benchmarks)
        run: sudo apt-get install -y xvfb
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            examples/city -> target
      - name: Download PillLauncher artifact
        uses: actions/download-artifact@v4
        with:
          name: pilllauncher-linux
          path: engine/pill_launcher/target/release
      - name: Validate launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/pill_launcher/target/release/PillLauncher
          test -x engine/pill_launcher/target/release/PillLauncher || {
            echo "ERROR: PillLauncher artifact missing or not executable"
            exit 1
          }
          echo "PillLauncher artifact OK"
      - name: Run city benchmark
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum \
            ./engine/pill_launcher/target/release/PillLauncher \
            -a benchmark \
            -p examples/city \
            --bench-iterations 5 \
            --bench-frames 1000 \
            --bench-features benchmark_window \
            -c release
