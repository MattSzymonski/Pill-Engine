[package]
name = "pill_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }

# Errors
thiserror = "2.0"

# Loggers
log = { version = "0.4", features = ["release_max_level_off"] }

# Loaders
tobj = { version = "4.0", optional = true }

# Other
readonly = "0.2"
winit = "0.30.13"
boolinator = "2.4.0"
bytemuck = { version = "1.4", features = [ "derive" ] }
lazy_static = "1.4.0"
dyn-clone = "1.0.4"
egui = { version = "0.35.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.0"
once_cell = "1"
bitvec = "1.0"
rand = "0.10"
web-time = "1"
rapier3d = { version = "0.34", optional = true }

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18"
rodio = { version = "0.20", features = ["wav", "mp3"] }
gilrs = "0.11"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
fs_extra = "1"
pill_assets = { path = "../pill_assets" }

[features]
project = []
internal = []
headless = []
networking = []
physics = ["dep:rapier3d"]
debug_ui = ["dep:egui"]
obj_loading = ["dep:tobj"]
all = ["project", "internal", "networking"]
