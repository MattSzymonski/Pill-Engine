[package]
name = "pill_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }

# Data containers
indexmap = "1.7.0"
trait_type_map = { path = "../../../trait_type_map" }

# Errors
anyhow = "1.0.45"
thiserror = "1.0.30"

# Loggers
log = "0.4"

# Loaders
image = "0.23"
tobj = "3.0"

# Audio
rodio = { version = "0.20", features = ["wav", "mp3"] }

# Other
readonly = "0.2"
winit = "0.30.12"
boolinator = "2.4.0"
bytemuck = { version = "1.4", features = ["derive"] }
lazy_static = "1.4.0"
config = "0.11"
dyn-clone = "1.0.4"
egui = "0.32.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.0"
gilrs = "0.11.0"
once_cell = "1.21.3"
bitvec = "1.0.1"
rand = "0.9.2"
rayon = "1.10"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[features]
game = []
internal = []
headless = []
networking = []
all = ["game", "internal", "networking"]
