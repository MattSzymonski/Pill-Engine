# Fixed minimum CPU level per platform, so shipped builds run on any CPU of that level
# (x86-64-v3 = AVX2/FMA/BMI2, Haswell 2013+ / Zen 1+; apple-m1 = all Apple Silicon Macs).
# Without this the compiler defaults to the SSE2 baseline on x86_64.
# To build hyper-optimized for one machine, change the value to "native" (binary then only
# runs on CPUs with the same features).
# wasm32 intentionally absent — target-cpu flags break WASM builds.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

# ARMv8-A baseline (NEON is always available on aarch64); covers Raspberry Pi 4+ and servers
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]
