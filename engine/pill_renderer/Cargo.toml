[package]
name = "pill_renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }
pill_engine = { path = "../pill_engine", features = ["internal"] }

# Logging
log = { version = "0.4", features = ["release_max_level_off"] }

# Other
glam = { version = "0.33", features = ["serde", "bytemuck"] }
winit = "0.30"
cgmath = "0.18"
bytemuck = { version = "1", features = ["derive"] }
# egui (optional — enabled by debug_ui feature)
egui = { version = "0.35.0", optional = true }
# Temporary local wgpu 30 bridge. Remove the path once upstream egui-wgpu supports wgpu 30.
egui-wgpu = { version = "0.35.0", path = "../../third_party/egui-wgpu", default-features = false, optional = true }


# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.0"
pollster = "0.4"
egui-winit = { version = "0.35.0", features = ["clipboard"], optional = true }


# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "webgpu",
    "wgsl",
] }
egui-winit = { version = "0.35.0", default-features = false, optional = true }

[features]
debug_ui = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "pill_engine/debug_ui",
]
hardware_ray_tracing = []
