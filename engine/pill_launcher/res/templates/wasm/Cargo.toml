# This crate is built only via `PillLauncher -a build -t web -p <project>`.
# The launcher copies this Cargo.toml into <project>/build/wasm/.build/pill_web_app/,
# rewrites the engine and pill_web path-deps to absolute paths, appends the
# `project` dependency pointing at the -p project directory, then runs wasm-pack.
# Building this crate directly with `cargo build` will fail - no project dep.
#
# Symmetry note: the bulk of the wasm runtime (panic hook, canvas, event loop)
# lives in the workspace crate `pill_web`. This template is the per-project cdylib
# that wasm-pack consumes - it provides only the bits that genuinely have to
# be per-project (the Project struct and the embedded config.ini).

[package]
name = "pill_web_app"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_web = { path = "../pill_web" }

wasm-bindgen = "0.2"
