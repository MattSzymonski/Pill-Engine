<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        .card {
            position: fixed;
            width: 350px;
            height: 250px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 180, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            border-radius: 12px;
            gap: 10px;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Green Overlay</h2>
        <p>This is an HTML layer rendered by WebKit.</p>
        <p>It sits on top of the window stack.</p>
    </div>
</body>

</html>
