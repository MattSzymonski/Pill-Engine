<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Popout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
    </style>
</head>

<body>
    <!-- FlexLayout injects a div here via createPortal from the main window.
       The initial window title comes from wry (the URL), so we immediately
       replace it with something meaningful.  FlexLayout's PopoutWindow later
       sets document.title to the tab name. -->
    <script>
        document.title = "Popout";
    </script>
</body>

</html>
